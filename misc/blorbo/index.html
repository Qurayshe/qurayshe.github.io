    const randomSkills = [
      "can fit inside teacup", "crimes & mischief", "bites ankles silently",
      "sleeping 22 hours daily", "100% immune to consequences",
      "squishes under doorframes", "hypnotic purring", "can detonate like grenade",
      "understands 12 dead languages", "cannot be perceived by radar",
      "professional soup tester", "steals shiny pebbles"
    ];

    document.getElementById('btnRandom').addEventListener('click', () => {
      const card = document.getElementById('statCard');
      card.style.animation = 'none';
      card.offsetHeight;
      card.style.animation = 'card-squish 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';

      const name = randomNames[Math.floor(Math.random() * randomNames.length)];
      const skill = randomSkills[Math.floor(Math.random() * randomSkills.length)];
      document.getElementById('inputName').value = name;
      document.getElementById('inputSkill').value = skill;

      clearBrokenStars();
      ['c', 'e', 's1', 's2', 'b', 'm'].forEach(k => {
        // 90% normal 0..3, 10% chance to roll a 4 or 5 for a hilarious break-off surprise!
        if (Math.random() < 0.1) {
          stats[k] = 4;
          setTimeout(() => breakOffStarOrSkull(k, 4), 200);
        } else {
          stats[k] = Math.floor(Math.random() * 4);
        }
      });

      showToast('🎲 new silly blorbo rolled!');
      updateAll();
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      document.getElementById('inputName').value = '';
      document.getElementById('inputSkill').value = '';
      clearBrokenStars();
      ['c', 'e', 's1', 's2', 'b', 'm'].forEach(k => stats[k] = 0);
      memCtx.fillStyle = '#ffffff';
      memCtx.fillRect(0, 0, memCanvas.width, memCanvas.height);
      hasUserDrawn = false;
      renderMemCanvas();
      saveState();
      showToast('reset to blank template! 🧹');
      updateAll();
    });

    function showToast(msg) {
      const toast = document.getElementById('toastMessage');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function renderFullCardCanvas() {
      const exportCanvas = document.createElement('canvas');
      const ew = 1000;
      const eh = 920;
      exportCanvas.width = ew;
      exportCanvas.height = eh;
      const ectx = exportCanvas.getContext('2d');

      ectx.fillStyle = '#ffffff';
      ectx.fillRect(0, 0, ew, eh);

      ectx.lineWidth = 5;
      ectx.strokeStyle = '#111111';
      ectx.strokeRect(15, 15, ew - 30, eh - 30);

      ectx.font = 'bold 32px "Patrick Hand", "Comic Sans MS", cursive, sans-serif';
      ectx.fillStyle = '#111111';
      ectx.textBaseline = 'top';

      const nameVal = document.getElementById('inputName').value.trim() || '__________';
      const skillVal = document.getElementById('inputSkill').value.trim() || '__________';

      ectx.fillText('name: ' + nameVal, 40, 36);
      ectx.beginPath();
      ectx.moveTo(40, 75);
      ectx.lineTo(440, 75);
      ectx.strokeStyle = '#999999';
      ectx.lineWidth = 3;
      ectx.stroke();

      ectx.fillText('skill: ' + skillVal, 480, 36);
      ectx.beginPath();
      ectx.moveTo(480, 75);
      ectx.lineTo(950, 75);
      ectx.stroke();

      const portraitBoxX = 40;
      const portraitBoxY = 95;
      const portraitBoxW = 920;
      const portraitBoxH = 380;

      ectx.drawImage(memCanvas, 0, 0, memCanvas.width, memCanvas.height,
                     portraitBoxX, portraitBoxY, portraitBoxW, portraitBoxH);
      ectx.lineWidth = 3.5;
      ectx.strokeStyle = '#222222';
      ectx.strokeRect(portraitBoxX, portraitBoxY, portraitBoxW, portraitBoxH);

      const statItems = [
        { key: 'c', label: 'chuckability:', badge: 'c', color: colors.c, isBones: false },
        { key: 'e', label: 'engaging:', badge: 'e', color: colors.e, isBones: false },
        { key: 's1', label: 'squishiness:', badge: 's', color: colors.s1, isBones: false },
        { key: 's2', label: 'splorpability:', badge: 's', color: colors.s2, isBones: false },
        { key: 'b', label: 'bones:', badge: 'b', color: colors.b, isBones: true },
        { key: 'm', label: 'media literacy:', badge: 'm', color: colors.m, isBones: false }
      ];

      let startY = 515;
      const rowGap = 60;

      statItems.forEach((item, idx) => {
        const rowY = startY + idx * rowGap;

        ectx.font = '900 36px "DynaPuff", "Shantell Sans", "Comic Sans MS", sans-serif';
        ectx.textAlign = 'center';
        ectx.textBaseline = 'middle';
        ectx.lineWidth = 5;
        ectx.strokeStyle = '#111';
        ectx.strokeText(item.badge, 58, rowY + 20);
        ectx.fillStyle = item.color;
        ectx.fillText(item.badge, 58, rowY + 20);

        ectx.setLineDash([4, 4]);
        ectx.strokeStyle = '#a8a8a8';
        ectx.lineWidth = 2;
        ectx.beginPath();
        ectx.moveTo(85, rowY + 20);
        ectx.lineTo(135, rowY + 20);
        ectx.stroke();
        ectx.setLineDash([]);

        ectx.font = 'bold 24px "Patrick Hand", "Comic Sans MS", cursive';
        ectx.fillStyle = '#111';
        ectx.textAlign = 'left';
        ectx.fillText(item.label, 145, rowY + 20);

        const currentVal = stats[item.key];
        const iconStartX = 410;
        for (let star = 1; star <= Math.min(3, currentVal); star++) {
          const ix = iconStartX + (star - 1) * 44;
          const iy = rowY + 6;
          drawExportIcon(ectx, ix, iy, true, item.isBones, false);
        }
        for (let star = currentVal + 1; star <= 3; star++) {
          const ix = iconStartX + (star - 1) * 44;
          const iy = rowY + 6;
          drawExportIcon(ectx, ix, iy, false, item.isBones, false);
        }
        if (currentVal > 3) {
          for (let star = 4; star <= Math.min(6, currentVal); star++) {
            const ix = iconStartX + (star - 1) * 44;
            const iy = rowY + 6;
            drawExportIcon(ectx, ix, iy, true, item.isBones, true);
          }
        }
      });

      const scX = 770;
      const scY = 675;
      const scOuterR = 145;
      const scCenterR = 30;

      ectx.beginPath();
      spiderAxes.forEach((axis, i) => {
        const rad = (axis.angleDeg * Math.PI) / 180;
        const px = scX + scOuterR * Math.cos(rad);
        const py = scY + scOuterR * Math.sin(rad);
        if (i === 0) ectx.moveTo(px, py);
        else ectx.lineTo(px, py);
      });
      ectx.closePath();
      ectx.lineWidth = 3;
      ectx.strokeStyle = '#b0b0b0';
      ectx.stroke();

      spiderAxes.forEach(axis => {
        const rad = (axis.angleDeg * Math.PI) / 180;
        const outerPx = scX + scOuterR * Math.cos(rad);
        const outerPy = scY + scOuterR * Math.sin(rad);
        const centerPx = scX + scCenterR * Math.cos(rad);
        const centerPy = scY + scCenterR * Math.sin(rad);

        ectx.beginPath();
        ectx.moveTo(centerPx, centerPy);
        ectx.lineTo(outerPx, outerPy);
        ectx.lineWidth = 3;
        ectx.strokeStyle = '#111';
        ectx.stroke();

        for (let t = 1; t <= 3; t++) {
          const rTick = scCenterR + (t / 3) * (scOuterR - scCenterR);
          const tx = scX + rTick * Math.cos(rad);
          const ty = scY + rTick * Math.sin(rad);
          const perp = rad + Math.PI / 2;
          const tlen = 7;
          ectx.beginPath();
          ectx.moveTo(tx + tlen * Math.cos(perp), ty + tlen * Math.sin(perp));
          ectx.lineTo(tx - tlen * Math.cos(perp), ty - tlen * Math.sin(perp));
          ectx.stroke();
        }

        ectx.beginPath();
        ectx.arc(outerPx, outerPy, 5, 0, Math.PI * 2);
        ectx.fillStyle = '#111';
        ectx.fill();

        const labelDist = scOuterR + 26;
        const lx = scX + labelDist * Math.cos(rad);
        const ly = scY + labelDist * Math.sin(rad);

        ectx.font = '900 34px "DynaPuff", "Shantell Sans", "Comic Sans MS", sans-serif';
        ectx.textAlign = 'center';
        ectx.textBaseline = 'middle';
        ectx.strokeStyle = '#111';
        ectx.lineWidth = 5;
        ectx.strokeText(axis.label, lx, ly);
        ectx.fillStyle = axis.color;
        ectx.fillText(axis.label, lx, ly);
      });

      ectx.beginPath();
      spiderAxes.forEach((axis, i) => {
        const val = stats[axis.key];
        const rCurrent = scCenterR + (val / 3) * (scOuterR - scCenterR);
        const rad = (axis.angleDeg * Math.PI) / 180;
        const px = scX + rCurrent * Math.cos(rad);
        const py = scY + rCurrent * Math.sin(rad);
        if (i === 0) ectx.moveTo(px, py);
        else ectx.lineTo(px, py);
      });
      ectx.closePath();
      ectx.fillStyle = hexToRgba(spiderChartColor, 0.44);
      ectx.fill();
      ectx.lineWidth = 4;
      ectx.strokeStyle = spiderChartColor;
      ectx.stroke();

      spiderAxes.forEach(axis => {
        const val = stats[axis.key];
        const rad = (axis.angleDeg * Math.PI) / 180;
        const outerPx = scX + scOuterR * Math.cos(rad);
        const outerPy = scY + scOuterR * Math.sin(rad);
        const rCurrent = scCenterR + (val / 3) * (scOuterR - scCenterR);
        const px = scX + rCurrent * Math.cos(rad);
        const py = scY + rCurrent * Math.sin(rad);

        if (val > 3) {
          ectx.beginPath();
          ectx.setLineDash([6, 4]);
          ectx.moveTo(outerPx, outerPy);
          ectx.lineTo(px, py);
          ectx.lineWidth = 3;
          ectx.strokeStyle = spiderChartColor;
          ectx.stroke();
          ectx.setLineDash([]);
        }

        ectx.beginPath();
        ectx.arc(px, py, val > 3 ? 8.5 : 6.5, 0, Math.PI * 2);
        ectx.fillStyle = val > 3 ? spiderChartColor : '#ffffff';
        ectx.fill();
        ectx.lineWidth = 3;
        ectx.strokeStyle = val > 3 ? '#ffe600' : '#111';
        ectx.stroke();
      });

      ectx.beginPath();
      spiderAxes.forEach((axis, i) => {
        const rad = (axis.angleDeg * Math.PI) / 180;
        const px = scX + scCenterR * Math.cos(rad);
        const py = scY + scCenterR * Math.sin(rad);
        if (i === 0) ectx.moveTo(px, py);
        else ectx.lineTo(px, py);
      });
      ectx.closePath();
      ectx.fillStyle = '#111';
      ectx.fill();

      // Draw resting broken stars and skulls at the bottom of the card on export canvas!
      const brokenEls = document.querySelectorAll('#brokenStarsContainer .broken-item');
      if (brokenEls.length > 0) {
        const cardEl = document.getElementById('statCard');
        const cardW = cardEl ? cardEl.clientWidth : 860;
        const cardH = cardEl ? cardEl.clientHeight : 800;
        const scaleX = ew / cardW;
        const scaleY = eh / cardH;

        brokenEls.forEach(b => {
          const bx = parseFloat(b.style.left) || 0;
          const by = parseFloat(b.style.top) || 0;
          const isB = b.classList.contains('broken-skull');
          drawExportIcon(ectx, bx * scaleX, by * scaleY, true, isB, true);
        });
      }

      return exportCanvas;
    }

    function drawExportIcon(ctx, x, y, isFilled, isBones, isBroken) {
      ctx.save();
      ctx.translate(x, y);

      if (isBroken) {
        ctx.rotate(0.2);
      }

      if (isBones) {
        ctx.beginPath();
        ctx.moveTo(6, 13);
        ctx.bezierCurveTo(6, 6, 9, 3, 14, 3);
        ctx.bezierCurveTo(19, 3, 22, 6, 22, 13);
        ctx.bezierCurveTo(22, 17, 19.5, 19, 18, 19);
        ctx.lineTo(18, 24);
        ctx.lineTo(10, 24);
        ctx.lineTo(10, 19);
        ctx.bezierCurveTo(8.5, 19, 6, 17, 6, 13);
        ctx.closePath();
        ctx.fillStyle = isFilled ? '#f5e8be' : '#ffffff';
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#111';
        ctx.stroke();

        if (isBroken) {
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#111';
          ctx.beginPath();
          ctx.moveTo(8.5, 10.5); ctx.lineTo(12.5, 13.5);
          ctx.moveTo(12.5, 10.5); ctx.lineTo(8.5, 13.5);
          ctx.moveTo(15.5, 10.5); ctx.lineTo(19.5, 13.5);
          ctx.moveTo(19.5, 10.5); ctx.lineTo(15.5, 13.5);
          ctx.moveTo(12, 4); ctx.lineTo(14, 8); ctx.lineTo(10, 12); ctx.lineTo(15, 16); ctx.lineTo(12.5, 21);
          ctx.stroke();
        } else {
          ctx.fillStyle = '#111';
          ctx.beginPath();
          ctx.ellipse(10.5, 12, 2.2, 2.8, 0, 0, Math.PI * 2);
          ctx.ellipse(17.5, 12, 2.2, 2.8, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.lineWidth = 1.3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(12.8, 20); ctx.lineTo(12.8, 23.5);
        ctx.moveTo(15.2, 20); ctx.lineTo(15.2, 23.5);
        ctx.stroke();

      } else {
        ctx.beginPath();
        ctx.moveTo(12, 2);
        ctx.lineTo(15.09, 8.26);
        ctx.lineTo(22, 9.27);
        ctx.lineTo(17, 14.14);
        ctx.lineTo(18.18, 21.02);
        ctx.lineTo(12, 17.77);
        ctx.lineTo(5.82, 21.02);
        ctx.lineTo(7, 14.14);
        ctx.lineTo(2, 9.27);
        ctx.lineTo(8.91, 8.26);
        ctx.closePath();

        ctx.fillStyle = isFilled ? '#ffe600' : '#ffffff';
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#111';
        ctx.stroke();

        if (isBroken) {
          ctx.lineWidth = 2.4;
          ctx.strokeStyle = '#111';
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(11, 2);
          ctx.lineTo(13.5, 8);
          ctx.lineTo(9.5, 13);
          ctx.lineTo(14, 17);
          ctx.lineTo(12, 21);
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    document.getElementById('btnExport').addEventListener('click', () => {
      showToast('rendering high-res card... 🖼️');
      const exportCanvas = renderFullCardCanvas();
      const nameVal = document.getElementById('inputName').value.trim() || 'blorbo';
      const link = document.createElement('a');
      const safeName = (nameVal.toLowerCase().replace(/[^a-z0-9]/g, '_') || 'blorbo');
      link.download = `${safeName}_stat_card.png`;
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
      showToast('card downloaded! 🎉');
    });

    document.getElementById('btnCopyClip').addEventListener('click', () => {
      const exportCanvas = renderFullCardCanvas();
      exportCanvas.toBlob(blob => {
        if (!blob) {
          showToast('could not create image blob 😿');
          return;
        }
        navigator.clipboard.write([
          new ClipboardItem({ 'image/png': blob })
        ]).then(() => {
          showToast('copied card to clipboard! 📋 paste it anywhere!');
        }).catch(err => {
          showToast('clipboard access denied, try save png instead!');
        });
      });
    });

    // --- Init ---
    window.addEventListener('load', () => {
      initSpiderBase();
      initSpiderNodes();
      resizeCanvas();
      saveState();
      updateAll();
      updateCanvasCursor();
    });

    window.addEventListener('resize', () => {
      resizeCanvas();
      startSpiderAnimation();
    });

  </script>
</body>
</html>
