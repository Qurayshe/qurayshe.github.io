<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js & Anime.js Interactive Test & Tutorial Suite</title>
  <meta name="description" content="A series of simple, fun, efficient tests, tutorials, and examples for Three.js and Anime.js features with live code and interactive controls.">
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Prism.js Dark Theme CSS for Code Inspector -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

  <!-- App Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand-header">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24">
            <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <line x1="12" y1="22" x2="12" y2="15.5" stroke="currentColor" stroke-width="2" />
            <polyline points="22 8.5 12 15.5 2 8.5" fill="none" stroke="currentColor" stroke-width="2" />
          </svg>
        </div>
        <div>
          <div class="brand-title">3D MOTION LAB</div>
          <div class="brand-subtitle">Three.js × Anime.js</div>
        </div>
      </div>

      <div class="search-filter-box">
        <div class="search-input-wrap">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="search-input" class="search-input" placeholder="Search examples or features..." />
        </div>
        <div class="filter-tags">
          <button class="filter-tag active" data-category="all">All (11)</button>
          <button class="filter-tag" data-category="three">Three.js</button>
          <button class="filter-tag" data-category="anime">Anime.js</button>
          <button class="filter-tag" data-category="hybrid">Hybrid</button>
        </div>
      </div>

      <!-- Navigation List -->
      <nav class="example-nav" id="example-nav">
        <!-- Injected dynamically by app.js -->
      </nav>
    </aside>

    <!-- Main 3D Viewport Stage -->
    <main class="main-stage">
      <header class="stage-header">
        <div class="stage-title-wrap">
          <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
          </button>
          <h1 class="stage-title" id="stage-title">Loading Example...</h1>
          <div class="stage-tags" id="stage-tags"></div>
        </div>

        <div class="stage-actions">
          <button class="btn-action active" id="btn-toggle-inspector" title="Toggle Inspector Drawer">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"/></svg>
            <span>Inspector & Guide</span>
          </button>
        </div>
      </header>

      <!-- Live 3D / 2D Canvas Viewport -->
      <div class="canvas-container" id="canvas-container">
        <!-- Active example renders here -->
      </div>

      <!-- Live FPS & Rendering Stats Badge -->
      <div class="stats-badge">
        <div class="stats-dot"></div>
        <span id="fps-value">60 FPS</span>
        <span style="opacity:0.3; margin: 0 4px;">|</span>
        <span id="stats-details" style="color: var(--text-secondary);">Ready</span>
      </div>

      <!-- Floating Timeline & Playback HUD -->
      <div class="playback-hud">
        <button class="hud-btn primary-play" id="btn-play-pause" title="Play / Pause">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="hud-btn" id="btn-restart" title="Restart Animation">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        </button>

        <div class="hud-scrubber-wrap">
          <input type="range" class="hud-scrubber" id="hud-scrubber" min="0" max="100" value="0" step="0.1" title="Timeline Scrubber" />
          <span class="hud-time" id="hud-time">00:00</span>
        </div>
      </div>
    </main>

    <!-- Right Inspector Drawer (Tutorial, Controls & Code) -->
    <aside class="inspector-drawer" id="inspector-drawer">
      <div class="inspector-tabs">
        <button class="inspector-tab active" data-tab="tutorial">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
          Tutorial
        </button>
        <button class="inspector-tab" data-tab="controls">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
          Controls
        </button>
        <button class="inspector-tab" data-tab="code">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
          Code
        </button>
      </div>

      <div class="inspector-content">
        <!-- Tab 1: Tutorial & Concept Guide -->
        <div class="tab-pane active" id="pane-tutorial"></div>

        <!-- Tab 2: Live Interactive Controls -->
        <div class="tab-pane" id="pane-controls"></div>

        <!-- Tab 3: Live Code Inspector -->
        <div class="tab-pane" id="pane-code">
          <div class="code-container">
            <div class="code-header">
              <span class="code-filename">example.js</span>
              <button class="btn-copy-code" id="btn-copy-code">Copy Code</button>
            </div>
            <pre class="code-block"><code class="language-javascript" id="code-content">// Code will appear here</code></pre>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- CDN Dependencies: Three.js r128, OrbitControls, Anime.js, Prism.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>

  <!-- Main ES Module Application Entrypoint -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
